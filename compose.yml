services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    mem_limit: 4g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - bd_net

  # Para iniciar la replicación:
  # 1. Levantar sin el slave
  # 2. En el master: pg_basebackup -h postgres -R -D $PGDATA/pgbasebackup -U replicator -v -P
  # 3. Copiar ese directorio a ./slave_data
  # 4. Descomentar el slave y volver a levantar
  # slave:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile-postgres-slave
  #   mem_limit: 4g
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #   volumes:
  #     - ./slave_data:/var/lib/postgresql/data/
  #   ports:
  #     - "5433:5432"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - bd_net

  apache:
    build:
      context: .
      dockerfile: Dockerfile-apache
    volumes:
      - ./:/var/www/html/
    ports:
      - "9090:80"
    depends_on:
      - postgres
    networks:
      - bd_net

networks:
  bd_net:
    driver: bridge
